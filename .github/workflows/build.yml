name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build with Maven
        run: mvn -B clean package
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: ChaosWeapons
          path: target/ChaosWeapons.jar
